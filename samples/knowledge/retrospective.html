<!DOCTYPE html>

<head><meta charset="utf-8"><title>kb v2.5.0 项目复盘</title></head>
<body>
  <h1>kb v2.5.0 项目复盘</h1>
  <p>发布日期：2026-11-08。本次版本的主题是“换模型不丢记忆”。</p>
  <h2>做对了什么</h2>
  <ul>
    <li>每个模型使用独立 collection，历史数据不会被新模型覆盖。</li>
    <li>迁移期间只读：写入返回 409，读取与关键词检索继续服务。</li>
    <li>先完成全量复制再切换模型，失败时旧库保持可用。</li>
    <li>迁移前卸载旧模型，2C2G 机器不会同时驻留两个模型。</li>
  </ul>
  <h2>遗留事项</h2>
  <p>旧模型数据需要用户手动删除；Web UI 已提供“删除数据”按钮。</p>
  <p>下一步计划：把迁移能力暴露为 CLI 子命令，方便无 Web UI 的环境使用。</p>
</body>
</html>
