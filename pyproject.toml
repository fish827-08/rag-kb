[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-memory"
version = "2.1.0"
description = "Local-first agent memory & knowledge service: hybrid retrieval + memory governance (decay / dedup / freshness), REST + MCP dual protocol, fully usable offline without an LLM"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "fish827-08" }]
keywords = ["mcp", "memory", "agent", "rag", "knowledge-base", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # 核心：服务运行 + 记忆存取 + 混合检索（torch 由 sentence-transformers 拉取；
    # Linux 安装脚本会先装 CPU 轮子，避免默认 CUDA 轮子带来数 GB 下载）
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "mcp>=2.0,<3.0",
    "chromadb>=1.5,<2.0",
    "rank_bm25>=0.2.2,<0.3",
    "jieba>=0.42,<0.43",
    "sentence-transformers>=3.0,<7.0",
    "transformers>=4.40,<6",
    "httpx>=0.27,<1.0",
    "langchain-text-splitters>=0.3,<2.0",
    "pydantic-settings>=2.0,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<16.0",
]

[project.optional-dependencies]
# 文档/网页摄取 + 目录监听（缺省安装只做记忆存取与纯文本/Markdown 摄取）
ingest = [
    "pypdf>=4.0,<7.0",
    "python-docx>=1.1,<2.0",
    "markitdown>=0.1,<0.2",
    "trafilatura>=1.8,<3.0",
    "lxml_html_clean>=0.4,<1.0",
    "watchdog>=4.0,<7.0",
]
# 云端 LLM（/ask 的 cloud/auto 模式）
llm = ["openai>=1.0,<4.0"]
full = [
    "pypdf>=4.0,<7.0",
    "python-docx>=1.1,<2.0",
    "markitdown>=0.1,<0.2",
    "trafilatura>=1.8,<3.0",
    "lxml_html_clean>=0.4,<1.0",
    "watchdog>=4.0,<7.0",
    "openai>=1.0,<4.0",
]

[project.urls]
Homepage = "https://github.com/fish827-08/rag-kb"
Repository = "https://github.com/fish827-08/rag-kb"

[project.scripts]
kb = "kb.cli:app"

[tool.setuptools.packages.find]
include = ["kb*"]
