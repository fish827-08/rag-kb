<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kb · 知识库与问答</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a7d4f'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-size='14' font-weight='700' fill='%23ffffff' text-anchor='middle'%3Ekb%3C/text%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #f1f3f5;
  --text: #1b1f24;
  --muted: #5b6572;
  --border: #e3e7ec;
  --brand: #0a7d4f;
  --brand-soft: #e8f6ef;
  --danger: #bf3a2b;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111418;
    --surface: #171b20;
    --surface-2: #1e242b;
    --text: #e6e9ec;
    --muted: #93a0ad;
    --border: #2a313a;
    --brand: #3ecf8e;
    --brand-soft: #123126;
    --danger: #ff7b6b;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius);
  padding: 8px 14px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
button:hover { background: var(--surface-2); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 1px;
}
button.primary {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
  font-weight: 500;
}
button.primary:hover { filter: brightness(1.06); background: var(--brand); }
button.primary:disabled, button:disabled { opacity: .55; cursor: default; }
input, select, textarea {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius);
  padding: 8px 12px;
  width: 100%;
}
textarea { resize: vertical; min-height: 96px; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  padding: 16px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 9px;
  background: var(--brand-soft); color: var(--brand);
  font-weight: 700; letter-spacing: .5px;
}
.sub { color: var(--muted); font-size: 13px; }
.top-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.project-field { display: flex; align-items: center; gap: 8px; }
.project-field span { color: var(--muted); font-size: 13px; white-space: nowrap; }
.project-field input { width: 160px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  background: var(--surface-2); color: var(--muted);
  font-size: 12px; white-space: nowrap;
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.pill.ok { color: var(--brand); }
.pill.ok::before { background: var(--brand); }
.pill.bad { color: var(--danger); }
.pill.bad::before { background: var(--danger); }
.lang-btn { padding: 4px 10px; font-size: 13px; color: var(--muted); }
details.settings summary {
  cursor: pointer; list-style: none; padding: 4px 10px;
  border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 13px; color: var(--muted);
}
details.settings summary::-webkit-details-marker { display: none; }
.settings-body {
  position: absolute; right: 24px; margin-top: 8px; width: 440px; max-height: 72vh;
  overflow: auto; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow);
}
.settings-body label { display: block; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
.settings-body label input, .settings-body label select { margin-top: 6px; }
.settings-body .hint { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
.set-group + .set-group { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 14px; }
.set-group h4 {
  margin: 0 0 10px; font-size: 13px; font-weight: 600;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.mini { font-size: 11px; font-weight: 400; color: var(--muted); }
.llm-block { margin: 8px 0 4px; }
.llm-block label + label { margin-top: 8px; }
button.ghost { width: 100%; margin-top: 8px; font-size: 12px; color: var(--muted); }
button.primary.wide { width: 100%; margin-top: 10px; }
.set-actions { display: flex; gap: 8px; margin-top: 14px; }

main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
  gap: 20px; padding: 20px 24px 40px;
  max-width: 1280px; margin: 0 auto;
}
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 20px; box-shadow: var(--shadow); min-width: 0;
}
.card h2 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
.card h3 {
  margin: 22px 0 10px; font-size: 13px; font-weight: 600;
  color: var(--muted); letter-spacing: .3px;
  display: flex; align-items: center; gap: 8px;
}
.count { font-weight: 400; color: var(--muted); }
.drop {
  margin-top: 14px; border: 1px dashed var(--border);
  border-radius: var(--radius); padding: 20px;
  text-align: center; background: var(--surface-2);
}
.drop.hot { border-color: var(--brand); background: var(--brand-soft); }
.drop p { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
.row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.row > input { flex: 1 1 200px; width: auto; }
.row label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.row label select { width: auto; padding: 6px 8px; }
.check { user-select: none; }
.status { margin-top: 12px; font-size: 13px; min-height: 20px; }
.status.err { color: var(--danger); white-space: pre-wrap; }
.status.ok { color: var(--brand); }
.status.busy { color: var(--muted); }

.docs { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow: auto; }
.doc {
  display: flex; gap: 10px; align-items: flex-start;
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 12px; background: var(--surface-2);
}
.doc-main { min-width: 0; flex: 1; }
.doc-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-meta { color: var(--muted); font-size: 12px; }
.doc button { padding: 4px 10px; font-size: 12px; color: var(--muted); }
.doc button:hover { color: var(--danger); border-color: var(--danger); }
.empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

.answer {
  margin-top: 14px; border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  background: var(--surface-2); white-space: pre-wrap;
  word-break: break-word; min-height: 96px;
  font-size: 14.5px; line-height: 1.75;
}
.answer .placeholder { color: var(--muted); }
.busy-line { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
.sources { display: flex; flex-direction: column; gap: 10px; }
.src {
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 12px; background: var(--surface);
}
.src-head {
  display: flex; gap: 8px; align-items: center;
  font-size: 12px; color: var(--muted); margin-bottom: 6px;
}
.idx {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--brand-soft); color: var(--brand);
  font-size: 11px; font-weight: 600;
}
.src-source { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; color: var(--text); }
.score { color: var(--brand); font-variant-numeric: tabular-nums; }
.src-text {
  margin: 0; font-size: 13px; color: var(--muted);
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 24px 28px; }
footer a { color: var(--muted); }
.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
  max-width: 90vw; padding: 10px 16px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  box-shadow: var(--shadow); font-size: 13px; opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s; z-index: 40;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.ok { border-color: var(--brand); color: var(--brand); }
.toast.err { border-color: var(--danger); color: var(--danger); }
.drop-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.card.wide-card { grid-column: 1 / -1; }
.graph-wrap {
  display: grid; grid-template-columns: minmax(0, 1fr) 260px;
  gap: 14px; margin-top: 10px; align-items: start;
}
@media (max-width: 700px) { .graph-wrap { grid-template-columns: 1fr; } }
.graph-svg {
  width: 100%; height: 380px; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--surface-2);
}
.graph-detail {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface-2); padding: 12px; min-height: 120px;
  font-size: 13px; color: var(--muted); word-break: break-word;
}
.graph-detail .g-title { color: var(--text); font-weight: 600; margin-bottom: 6px; }
.graph-detail .g-tag {
  display: inline-block; margin: 2px 4px 2px 0; padding: 1px 8px;
  border-radius: 999px; background: var(--brand-soft); color: var(--brand);
  font-size: 11px;
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">kb</span>
    <span class="sub" data-i18n="header.sub"></span>
  </div>
  <div class="top-actions">
    <div class="project-field">
      <span data-i18n="project.label"></span>
      <input id="project" list="projectList" data-i18n-ph="project.ph">
      <datalist id="projectList"></datalist>
    </div>
    <span id="health" class="pill" data-i18n="health.checking"></span>
    <button id="langToggle" class="lang-btn" type="button">EN</button>
    <details class="settings" id="settings">
      <summary data-i18n="settings.title"></summary>
      <div class="settings-body">
        <div class="set-group">
          <h4 data-i18n="auth.title"></h4>
          <label><span data-i18n="auth.label"></span>
            <input id="apiKey" type="password" autocomplete="off" data-i18n-ph="auth.ph">
          </label>
          <p class="hint" data-i18n="auth.hint"></p>
        </div>

        <div class="set-group">
          <h4><span data-i18n="llm.title"></span> <span class="mini" id="llmBadge">…</span></h4>
          <label><span data-i18n="llm.modeLabel"></span>
            <select id="llmMode">
              <option value="off" data-i18n="llm.modeOff"></option>
              <option value="local" data-i18n="llm.modeLocal"></option>
              <option value="auto" data-i18n="llm.modeAuto"></option>
              <option value="cloud" data-i18n="llm.modeCloud"></option>
            </select>
          </label>

          <div class="llm-block" id="localBlock">
            <label><span data-i18n="llm.ollamaUrl"></span>
              <input id="ollamaUrl" placeholder="http://localhost:11434">
            </label>
            <label><span data-i18n="llm.localModel"></span>
              <input id="localModel" list="ollamaModels" placeholder="qwen3:1.7b">
              <datalist id="ollamaModels"></datalist>
            </label>
            <button id="refreshModels" class="ghost" type="button" data-i18n="llm.refresh"></button>
            <p class="hint" id="localHint"></p>
          </div>

          <div class="llm-block" id="cloudBlock">
            <label><span data-i18n="llm.cloudUrl"></span>
              <input id="cloudUrl" placeholder="OpenAI-compatible endpoint, e.g. https://api.openai.com/v1">
            </label>
            <label><span data-i18n="llm.cloudModel"></span>
              <input id="cloudModel" placeholder="model name">
            </label>
            <label><span data-i18n="llm.cloudKey"></span>
              <input id="cloudKey" type="password" autocomplete="off" data-i18n-ph="llm.cloudKeyPh">
            </label>
            <p class="hint" id="cloudHint"></p>
          </div>

          <button id="saveLlm" class="primary wide" type="button" data-i18n="llm.save"></button>
          <p class="hint" id="llmHint" data-i18n="llm.hint"></p>
        </div>
        <div class="set-actions">
          <button id="saveKey" data-i18n="auth.save"></button>
          <button id="clearKey" data-i18n="auth.clear"></button>
        </div>
      </div>
    </details>
  </div>
</header>

<main>
  <section class="card">
    <h2 data-i18n="ingest.title"></h2>
    <div class="drop" id="drop">
      <input id="file" type="file" multiple hidden>
      <input id="folder" type="file" webkitdirectory directory multiple hidden>
      <div class="drop-actions">
        <button id="pick" data-i18n="ingest.pick"></button>
        <button id="pickFolder" data-i18n="ingest.pickFolder"></button>
      </div>
      <p data-i18n="ingest.dropHint"></p>
    </div>
    <div class="row">
      <input id="url" data-i18n-ph="ingest.urlPh">
      <button id="ingestUrl" data-i18n="ingest.urlBtn"></button>
    </div>
    <div class="status" id="ingestStatus" aria-live="polite"></div>
    <h3><span data-i18n="docs.title"></span> <span class="count" id="docCount"></span></h3>
    <div class="docs" id="docs"></div>
  </section>

  <section class="card">
    <h2 data-i18n="ask.title"></h2>
    <textarea id="question" data-i18n-ph="ask.ph"></textarea>
    <div class="row">
      <label><span data-i18n="ask.topk"></span>
        <select id="topk">
          <option value="5" selected>5</option>
          <option value="8">8</option>
          <option value="10">10</option>
          <option value="15">15</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="searchOnly" style="width:auto"> <span data-i18n="ask.searchOnly"></span></label>
      <button id="ask" class="primary" data-i18n="ask.btn"></button>
    </div>
    <div class="answer" id="answer" aria-live="polite">
      <span class="placeholder" data-i18n="ask.placeholder"></span>
    </div>
    <div class="busy-line" id="busyLine"></div>
    <h3><span data-i18n="sources.title"></span> <span class="count" id="srcCount"></span></h3>
    <div class="sources" id="sources"></div>
  </section>

  <section class="card wide-card">
    <h2>
      <span data-i18n="graph.title"></span>
      <span class="count" id="graphCount"></span>
      <button id="refreshGraph" class="ghost" type="button" style="width:auto;margin:0 0 0 auto"
              data-i18n="graph.refresh"></button>
    </h2>
    <p class="hint" data-i18n="graph.hint"></p>
    <div class="graph-wrap">
      <svg id="graphSvg" class="graph-svg" viewBox="0 0 800 420" role="img"></svg>
      <div class="graph-detail" id="graphDetail">
        <span data-i18n="graph.empty"></span>
      </div>
    </div>
  </section>
</main>

<footer>
  <span data-i18n="footer.note"></span>
  <a href="/docs" target="_blank" rel="noopener" data-i18n="footer.api"></a> ·
  <a href="/" target="_blank" rel="noopener" data-i18n="footer.nav"></a>
</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

  var $ = function (id) { return document.getElementById(id); };
  var state = { apiKey: "", project: "", lang: "zh", llm: null, busy: false, docCount: 0 };

  function T(key, vars) {
    var dict = I18N[state.lang] || I18N.zh;
    var text = dict[key] || I18N.zh[key] || key;
    if (vars) {
      Object.keys(vars).forEach(function (k) {
        text = text.replace(new RegExp("\\{" + k + "\\}", "g"), String(vars[k]));
      });
    }
    return text;
  }

  function applyLang(lang) {
    state.lang = lang === "en" ? "en" : "zh";
    localStorage.setItem(LANG_STORE, state.lang);
    document.documentElement.lang = state.lang === "en" ? "en" : "zh-CN";
    $("langToggle").textContent = T("lang.btn");
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = T(el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("[data-i18n-ph]").forEach(function (el) {
      el.placeholder = T(el.getAttribute("data-i18n-ph"));
    });
    if (state.llm) { updateLlmBadge(state.llm); applyLlm(state.llm, false); }
    loadDocs();
  }

  /* ---------- 基础工具 ---------- */

  function projectParam() {
    var v = ($("project").value || "").trim();
    return v ? v : null;
  }

  function headers(extra) {
    var h = extra || {};
    if (state.apiKey) h["X-API-Key"] = state.apiKey;
    return h;
  }

  function setStatus(text, kind) {
    var el = $("ingestStatus");
    el.textContent = text;
    el.className = "status" + (kind ? " " + kind : "");
  }

  var SUPPORTED = [".md", ".txt", ".pdf", ".docx", ".csv", ".json",
                   ".html", ".htm", ".pptx", ".xlsx", ".xlsm", ".xls"];
  var toastTimer = null;

  function showToast(text, kind) {
    var el = $("toast");
    el.textContent = text;
    el.className = "toast show" + (kind ? " " + kind : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = "toast"; }, 3000);
  }

  function filterSupported(files) {
    var list = Array.prototype.slice.call(files || []);
    var ok = list.filter(function (f) {
      var name = (f.name || "").toLowerCase();
      var dot = name.lastIndexOf(".");
      return dot >= 0 && SUPPORTED.indexOf(name.slice(dot)) >= 0;
    });
    return { ok: ok, total: list.length };
  }

  function errorText(err) {
    var msg = (err && err.message) || String(err);
    if (msg === "UNAUTHORIZED") return T("err.needKey");
    return msg;
  }

  /* 统一请求：超时可控（首次检索可能要加载嵌入模型） */
  function api(path, options, timeoutMs) {
    options = options || {};
    options.headers = headers(options.headers || {});
    var limit = timeoutMs || 30000;
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, limit);
    options.signal = ctrl.signal;
    return fetch(path, options).then(function (resp) {
      return resp.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
        if (!resp.ok) {
          var detail = (data && (data.detail || data)) || {};
          var msg = detail.message || detail.error || ("HTTP " + resp.status);
          if (resp.status === 401) msg = "UNAUTHORIZED";
          var err = new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
          err.status = resp.status;
          throw err;
        }
        return data;
      });
    }).catch(function (err) {
      if (err && err.name === "AbortError") {
        var te = new Error(T("err.timeout", { s: Math.round(limit / 1000) }));
        te.timeout = true;
        throw te;
      }
      throw err;
    }).finally(function () { clearTimeout(timer); });
  }

  /* ---------- 服务状态 ---------- */

  function checkHealth() {
    var el = $("health");
    api("/api/v1/healthz").then(function (data) {
      el.textContent = T("health.online");
      el.className = "pill ok";
      if (data && data.version) el.title = "version " + data.version;
      state.embedder = data && data.embedder && data.embedder.state;
    }).catch(function (err) {
      el.textContent = err.status === 401 ? T("health.needKey") : T("health.offline");
      el.className = "pill bad";
    });
  }

  /* ---------- LLM 配置 ---------- */

  function updateLlmBadge(data) {
    var el = $("llmBadge");
    if (!data) { el.textContent = T("llm.readFail"); return; }
    var status = data.status === "disabled" ? T("llm.status.disabled") : data.status;
    el.textContent = data.mode + " · " + status;
    el.style.color = data.status === "disabled" ? "var(--danger)" : "var(--brand)";
  }

  function toggleLlmBlocks() {
    var mode = $("llmMode").value;
    $("localBlock").style.display = (mode === "off" || mode === "cloud") ? "none" : "block";
    $("cloudBlock").style.display = (mode === "off" || mode === "local") ? "none" : "block";
  }

  function applyLlm(data, keepHints) {
    if (!data) return;
    state.llm = data;
    $("llmMode").value = data.mode || "off";
    $("ollamaUrl").value = (data.local && data.local.base_url) || "";
    $("localModel").value = (data.local && data.local.model) || "";
    $("cloudUrl").value = (data.cloud && data.cloud.base_url) || "";
    $("cloudModel").value = (data.cloud && data.cloud.model) || "";
    if (!keepHints) {
      $("cloudHint").textContent = data.cloud && data.cloud.api_key_set
        ? T("llm.keySet") : T("llm.keyMissing");
      $("localHint").textContent = data.local && data.local.available
        ? T("llm.ollamaOnline") : T("llm.ollamaOffline");
    }
    updateLlmBadge(data);
    toggleLlmBlocks();
  }

  function loadLlm() {
    $("llmBadge").textContent = T("llm.reading");
    api("/api/v1/llm").then(applyLlm).catch(function (err) {
      $("llmBadge").textContent = T("llm.readFail");
      $("llmHint").textContent = errorText(err);
    });
  }

  function refreshModels() {
    var base = ($("ollamaUrl").value || "").trim();
    $("localHint").textContent = T("llm.reading");
    api("/api/v1/llm/ollama/models" + (base ? "?base_url=" + encodeURIComponent(base) : ""))
      .then(function (data) {
        var list = $("ollamaModels");
        list.textContent = "";
        (data.models || []).forEach(function (name) {
          var opt = document.createElement("option");
          opt.value = name;
          list.appendChild(opt);
        });
        $("localHint").textContent = data.ok
          ? T("llm.modelsFound", { n: data.models.length })
          : (data.message || T("llm.ollamaOffline"));
      }).catch(function (err) {
        $("localHint").textContent = errorText(err);
      });
  }

  function saveLlm() {
    var mode = $("llmMode").value;
    var payload = { mode: mode };
    if (mode !== "off" && mode !== "cloud") {
      var ollama = ($("ollamaUrl").value || "").trim();
      var localModel = ($("localModel").value || "").trim();
      if (ollama) payload.ollama_base_url = ollama;
      if (localModel) payload.local_model = localModel;
    }
    if (mode !== "off" && mode !== "local") {
      var cloudUrl = ($("cloudUrl").value || "").trim();
      var cloudModel = ($("cloudModel").value || "").trim();
      var cloudKey = ($("cloudKey").value || "").trim();
      if (cloudUrl) payload.cloud_base_url = cloudUrl;
      if (cloudModel) payload.cloud_model = cloudModel;
      if (cloudKey) { payload.cloud_api_key = cloudKey; $("cloudKey").value = ""; }
    }
    $("llmHint").textContent = T("llm.saving");
    api("/api/v1/llm/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }, 20000).then(function (data) {
      applyLlm(data, true);
      $("llmHint").textContent = T("llm.saved", { mode: data.mode, status: data.status });
      showToast(T("toast.llmSaved"), "ok");
      checkHealth();
    }).catch(function (err) {
      var msg = errorText(err);
      $("llmHint").textContent = T("llm.saveFail", { msg: msg });
      showToast(T("toast.llmSaveFail", { msg: msg }), "err");
    });
  }

  /* ---------- 文档列表 ---------- */

  function renderDocs(items) {
    var box = $("docs");
    box.textContent = "";
    state.docCount = items.length;
    $("docCount").textContent = items.length ? "（" + items.length + "）" : "";
    if (!items.length) {
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = T("docs.empty");
      box.appendChild(e);
      return;
    }
    items.forEach(function (d) {
      var row = document.createElement("div");
      row.className = "doc";

      var main = document.createElement("div");
      main.className = "doc-main";
      var name = document.createElement("div");
      name.className = "doc-name";
      name.textContent = d.source || "(no source)";
      name.title = d.source || "";
      var meta = document.createElement("div");
      meta.className = "doc-meta";
      var kind = d.kind === "table" ? T("docs.kindTable")
        : (d.kind === "web" ? T("docs.kindWeb") : "");
      meta.textContent = (kind ? kind + " · " : "") + (d.chunks || 0) + " · " + (d.chars || 0);
      main.appendChild(name);
      main.appendChild(meta);

      var del = document.createElement("button");
      del.type = "button";
      del.textContent = T("docs.delete");
      del.addEventListener("click", function () { removeDoc(d.source); });

      row.appendChild(main);
      row.appendChild(del);
      box.appendChild(row);
    });
  }

  function loadDocs() {
    var p = projectParam();
    var path = "/api/v1/documents" + (p ? "?project=" + encodeURIComponent(p) : "");
    return api(path).then(function (data) {
      renderDocs((data && data.items) || []);
    }).catch(function (err) {
      setStatus(T("docs.readFail", { msg: errorText(err) }), "err");
    });
  }

  function removeDoc(source) {
    if (!source) return;
    if (!window.confirm(T("docs.confirm", { name: source }))) return;
    var p = projectParam();
    var path = "/api/v1/documents?source=" + encodeURIComponent(source) +
      (p ? "&project=" + encodeURIComponent(p) : "");
    api(path, { method: "DELETE" }).then(function (data) {
      setStatus(T("docs.deleted", { n: (data && data.deleted) || 0 }), "ok");
      loadDocs();
    }).catch(function (err) {
      setStatus(T("delete.fail", { msg: errorText(err) }), "err");
    });
  }

  /* ---------- 入库 ---------- */

  function ingestOne(file) {
    var fd = new FormData();
    fd.append("file", file, file.name);
    var p = projectParam();
    if (p) fd.append("project", p);
    return api("/api/v1/documents", { method: "POST", body: fd }, 180000);
  }

  function uploadFiles(files) {
    if (state.busy) return;
    var picked = filterSupported(files);
    if (picked.total && !picked.ok.length) {
      showToast(T("toast.noSupported", { ext: SUPPORTED.join(" ") }), "err");
      return;
    }
    var list = picked.ok;
    if (!list.length) return;
    state.busy = true;
    $("pick").disabled = true;
    $("pickFolder").disabled = true;
    var done = 0;
    var failed = [];
    setStatus(T("upload.start", { n: list.length }), "busy");

    var chain = Promise.resolve();
    list.forEach(function (f) {
      chain = chain.then(function () {
        setStatus(T("upload.doing", { i: done + 1, n: list.length, name: f.name }), "busy");
        return ingestOne(f).then(function (r) {
          done += 1;
          setStatus(T("upload.done", {
            i: done, n: list.length, name: f.name, c: r.chunks || 0
          }), "ok");
        }).catch(function (err) {
          failed.push(f.name + "：" + errorText(err));
          done += 1;
        });
      });
    });

    chain.then(function () {
      state.busy = false;
      $("pick").disabled = false;
      $("pickFolder").disabled = false;
      if (failed.length) {
        setStatus(T("upload.someFailed", {
          ok: list.length - failed.length, n: list.length, bad: failed.length
        }) + "\n" + failed.join("\n"), "err");
        showToast(T("upload.someFailed", {
          ok: list.length - failed.length, n: list.length, bad: failed.length
        }), "err");
      } else {
        setStatus(T("upload.allDone", { n: list.length }), "ok");
        showToast(T("toast.uploadDone", { n: list.length }), "ok");
      }
      loadDocs();
    });
  }

  function ingestUrl() {
    var url = $("url").value.trim();
    if (!url || state.busy) return;
    state.busy = true;
    $("ingestUrl").disabled = true;
    setStatus(T("url.fetching"), "busy");
    var body = { url: url };
    var p = projectParam();
    if (p) body.project = p;
    api("/api/v1/ingest/web", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }, 60000).then(function (r) {
      setStatus(T("url.done", { source: r.source || url, c: r.chunks || 0 }), "ok");
      $("url").value = "";
      loadDocs();
    }).catch(function (err) {
      setStatus(T("url.fail", { msg: errorText(err) }), "err");
    }).finally(function () {
      state.busy = false;
      $("ingestUrl").disabled = false;
    });
  }

  /* ---------- 问答 ---------- */

  function renderSources(items) {
    var box = $("sources");
    box.textContent = "";
    $("srcCount").textContent = items.length ? "（" + items.length + "）" : "";
    items.forEach(function (s, i) {
      var card = document.createElement("div");
      card.className = "src";

      var head = document.createElement("div");
      head.className = "src-head";
      var idx = document.createElement("span");
      idx.className = "idx";
      idx.textContent = String(i + 1);
      var src = document.createElement("span");
      src.className = "src-source";
      src.textContent = s.source || "-";
      src.title = (s.id || "") + " " + (s.source || "");
      var score = document.createElement("span");
      score.className = "score";
      score.textContent = "score " + (typeof s.score === "number" ? s.score.toFixed(2) : "-");
      head.appendChild(idx);
      head.appendChild(src);
      head.appendChild(score);

      var text = document.createElement("p");
      text.className = "src-text";
      text.textContent = s.content || "";

      card.appendChild(head);
      card.appendChild(text);
      box.appendChild(card);
    });
  }

  function ask() {
    var q = $("question").value.trim();
    if (!q || state.busy) return;
    var topK = parseInt($("topk").value, 10) || 5;
    var p = projectParam();
    var searchOnly = $("searchOnly").checked;
    var timeoutMs = searchOnly ? 120000 : 180000;
    state.busy = true;
    $("ask").disabled = true;
    $("ask").textContent = T("ask.btnBusy");
    $("answer").innerHTML = "";
    $("sources").textContent = "";
    $("srcCount").textContent = "";

    var started = Date.now();
    function tick() {
      var sec = Math.round((Date.now() - started) / 1000);
      var line = T("busy.searching", { s: sec });
      if (sec >= 5) line += "  " + T("busy.modelHint");
      $("busyLine").textContent = line;
    }
    tick();
    var timer = setInterval(tick, 1000);

    var path = searchOnly ? "/api/v1/search" : "/api/v1/ask";
    var body = searchOnly ? { query: q, top_k: topK, table: true }
                          : { question: q, top_k: topK };
    if (p) body.project = p;

    api(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }, timeoutMs).then(function (data) {
      var answer = $("answer");
      answer.textContent = "";
      if (searchOnly) {
        if (data && data.table) {
          answer.textContent = data.answer || "—";
          renderSources((data && data.sources) || []);
        } else {
          var hits = (data && data.results) || [];
          answer.textContent = T("ask.emptyHits", { n: hits.length });
          renderSources(hits);
        }
      } else {
        answer.textContent = (data && data.answer) || "—";
        renderSources((data && data.sources) || []);
      }
    }).catch(function (err) {
      var answer = $("answer");
      answer.textContent = "";
      var msg = err && err.timeout ? err.message : errorText(err);
      if (err && err.status === 503) msg = T("err.llmOff");
      answer.textContent = msg;
    }).finally(function () {
      clearInterval(timer);
      $("busyLine").textContent = "";
      state.busy = false;
      $("ask").disabled = false;
      $("ask").textContent = T("ask.btn");
    });
  }

  /* ---------- 记忆图谱 ---------- */

  var SVG_NS = "http://www.w3.org/2000/svg";
  var RELATION_COLORS = {
    related: "#3ecf8e", supersedes: "#f0b429", depends_on: "#5b8def",
    part_of: "#b07cf0", contradicts: "#ff7b6b"
  };

  function svgEl(tag, attrs) {
    var el = document.createElementNS(SVG_NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }

  function showGraphNode(node) {
    var box = $("graphDetail");
    box.textContent = "";
    var title = document.createElement("div");
    title.className = "g-title";
    title.textContent = node.label || "(empty)";
    box.appendChild(title);
    var meta = document.createElement("div");
    meta.textContent = (node.project ? "project: " + node.project + " · " : "global · ") +
      "degree " + (node.degree || 0);
    box.appendChild(meta);
    (node.tags || []).forEach(function (tag) {
      var span = document.createElement("span");
      span.className = "g-tag";
      span.textContent = tag;
      box.appendChild(span);
    });
  }

  function renderGraph(data) {
    var svg = $("graphSvg");
    svg.textContent = "";
    var nodes = (data && data.nodes) || [];
    var edges = (data && data.edges) || [];
    $("graphCount").textContent = nodes.length
      ? "（" + nodes.length + " / " + edges.length + "）" : "";
    if (!nodes.length) {
      var tip = svgEl("text", { x: 400, y: 210, "text-anchor": "middle",
                                fill: "#8b949e", "font-size": 14 });
      tip.textContent = T("graph.empty");
      svg.appendChild(tip);
      return;
    }
    $("graphDetail").textContent = T("graph.nodeTip");
    var W = 800, H = 420, cx = W / 2, cy = H / 2;
    var sorted = nodes.slice().sort(function (a, b) {
      return (b.degree || 0) - (a.degree || 0);
    });
    var inner = sorted.length <= 12 ? sorted.length : Math.ceil(Math.sqrt(sorted.length));
    var pos = {};
    sorted.forEach(function (n, i) {
      var ring = i < inner ? 0 : 1;
      var idx = ring === 0 ? i : i - inner;
      var count = ring === 0 ? inner : sorted.length - inner;
      var radius = ring === 0 ? (count <= 6 ? 90 : 120) : 190;
      var angle = (2 * Math.PI * idx / Math.max(1, count)) - Math.PI / 2;
      pos[n.id] = { x: cx + radius * Math.cos(angle),
                    y: cy + radius * Math.sin(angle) };
    });
    edges.forEach(function (e) {
      var a = pos[e.from], b = pos[e.to];
      if (!a || !b) return;
      svg.appendChild(svgEl("line", {
        x1: a.x, y1: a.y, x2: b.x, y2: b.y,
        stroke: RELATION_COLORS[e.relation] || "#555",
        "stroke-width": 1.5, opacity: 0.75
      }));
    });
    nodes.forEach(function (n) {
      var p = pos[n.id];
      if (!p) return;
      var r = 6 + Math.min(n.degree || 0, 6);
      var circle = svgEl("circle", {
        cx: p.x, cy: p.y, r: r,
        fill: "var(--brand)", stroke: "var(--surface)", "stroke-width": 2,
        style: "cursor:pointer"
      });
      var title = svgEl("title", {});
      title.textContent = (n.label || "") + "\n" + T("graph.nodeTip");
      circle.appendChild(title);
      circle.addEventListener("click", function () { showGraphNode(n); });
      svg.appendChild(circle);
      var label = svgEl("text", {
        x: p.x, y: p.y + r + 13, "text-anchor": "middle",
        fill: "#8b949e", "font-size": 10
      });
      label.textContent = (n.label || "").slice(0, 12);
      svg.appendChild(label);
    });
  }

  function loadGraph() {
    var p = projectParam();
    api("/api/v1/graph" + (p ? "?project=" + encodeURIComponent(p) : ""))
      .then(renderGraph)
      .catch(function (err) {
        $("graphCount").textContent = "";
        $("graphDetail").textContent = errorText(err);
      });
  }

  /* ---------- 设置与事件绑定 ---------- */

  function saveSettings() {
    state.apiKey = $("apiKey").value.trim();
    state.project = ($("project").value || "").trim();
    if (state.apiKey) localStorage.setItem(KEY_STORE, state.apiKey);
    else localStorage.removeItem(KEY_STORE);
    if (state.project) localStorage.setItem(PROJECT_STORE, state.project);
    else localStorage.removeItem(PROJECT_STORE);
    $("settings").open = false;
    checkHealth();
    loadDocs();
    loadLlm();
    loadGraph();
  }

  function clearKey() {
    $("apiKey").value = "";
    localStorage.removeItem(KEY_STORE);
    state.apiKey = "";
    $("settings").open = false;
    checkHealth();
  }

  function bind() {
    $("pick").addEventListener("click", function () { $("file").click(); });
    $("file").addEventListener("change", function (e) {
      uploadFiles(e.target.files);
      e.target.value = "";
    });
    $("pickFolder").addEventListener("click", function () { $("folder").click(); });
    $("folder").addEventListener("change", function (e) {
      uploadFiles(e.target.files);
      e.target.value = "";
    });
    $("ingestUrl").addEventListener("click", ingestUrl);
    $("url").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); ingestUrl(); }
    });
    $("ask").addEventListener("click", ask);
    $("langToggle").addEventListener("click", function () {
      applyLang(state.lang === "zh" ? "en" : "zh");
    });

    var drop = $("drop");
    ["dragenter", "dragover"].forEach(function (ev) {
      drop.addEventListener(ev, function (e) {
        e.preventDefault();
        drop.classList.add("hot");
      });
    });
    ["dragleave", "drop"].forEach(function (ev) {
      drop.addEventListener(ev, function (e) {
        e.preventDefault();
        drop.classList.remove("hot");
      });
    });
    drop.addEventListener("drop", function (e) {
      var files = e.dataTransfer && e.dataTransfer.files;
      uploadFiles(files);
    });

    $("saveKey").addEventListener("click", saveSettings);
    $("clearKey").addEventListener("click", clearKey);
    $("llmMode").addEventListener("change", toggleLlmBlocks);
    $("refreshModels").addEventListener("click", refreshModels);
    $("saveLlm").addEventListener("click", saveLlm);
    $("refreshGraph").addEventListener("click", loadGraph);
    $("project").addEventListener("change", function () { saveSettings(); });
    $("project").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); saveSettings(); }
    });
  }

  state.apiKey = localStorage.getItem(KEY_STORE) || "";
  state.project = localStorage.getItem(PROJECT_STORE) || "";
  var savedLang = localStorage.getItem(LANG_STORE);
  state.lang = savedLang === "en" ? "en" : "zh";
  $("apiKey").value = state.apiKey;
  $("project").value = state.project;

  bind();
  applyLang(state.lang);
  checkHealth();
  loadLlm();
  loadGraph();
})();
</script>
</body>
</html>
